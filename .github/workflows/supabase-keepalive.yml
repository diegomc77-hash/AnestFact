# Ping automático a Supabase para evitar pausa por inactividad (plan free ~7 días).
# Configurar UN secret en GitHub: Settings → Secrets → Actions → SUPABASE_ANON_KEY
name: Supabase keepalive

on:
  schedule:
    # 2 veces al día (UTC): ~5:00 y ~17:00 Argentina (UTC-3)
    - cron: '0 8,20 * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: https://xntvibfsuubedplptvzs.supabase.co

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secret configurado
        run: |
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Falta SUPABASE_ANON_KEY. GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Ping anesfact_datos
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ env.SUPABASE_URL }}/rest/v1/anesfact_datos?select=clave&limit=1")
          echo "HTTP $code ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          if [ "$code" = "200" ] || [ "$code" = "206" ]; then
            echo "Supabase respondió OK — proyecto activo."
          else
            echo "::error::Supabase respondió HTTP $code. ¿Proyecto pausado? Entrá a supabase.com y hacé Restore."
            exit 1
          fi
