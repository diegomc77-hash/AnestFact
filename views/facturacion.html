<div id="view-facturacion" class="view">
  <div id="ia-badge" style="display:none;margin-bottom:10px"></div>
  <div id="fact-pac-badge" style="font-size:12px;color:var(--text2);margin-bottom:10px;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px"></div>
  <div class="card">
    <div class="ct">Obra social</div>
    <div class="field"><label>Obra social *</label>
      <div class="ac-wrap">
        <div class="fr"><input class="fi" type="text" id="f-obra" placeholder="IOSFA / PAMI / OSDE..." autocomplete="off" oninput="acObraSocial('f-obra','ac-obra')" onkeydown="acKey(event,'ac-obra')"><button class="mic" id="m-obra" onclick="mic('f-obra','m-obra')">&#127897;</button></div>
        <div class="ac-list" id="ac-obra"></div>
      </div>
    </div>
    <div class="field"><label>N&deg; Afiliado *</label>
      <div class="fr"><input class="fi" type="text" id="f-afil" name="paciente_num_afiliado" placeholder="D352042102" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" inputmode="numeric" readonly onfocus="this.removeAttribute('readonly')"><button class="mic" id="m-afil" onclick="mic('f-afil','m-afil')">&#127897;</button></div>
    </div>
    <hr class="hr">
    <div class="tog-row">
      <div><div style="font-size:14px">Obesidad m&oacute;rbida</div><div style="font-size:11px;color:var(--text3)">+2 complejidades ADAARC</div></div>
      <label class="tog"><input type="checkbox" id="f-ob"><span class="ts"></span></label>
    </div>
    <hr class="hr">
    <div class="tog-row">
      <div style="font-size:14px">Enviar a ADAARC/evweb</div>
      <label class="tog"><input type="checkbox" id="f-env" checked><span class="ts"></span></label>
    </div>
  </div>
  <div class="card">
    <div class="ct">Pr&aacute;cticas ADAARC</div>
    <div id="pracs-list"><p style="font-size:12px;color:var(--text3)">Sin pr&aacute;cticas</p></div>
    <div class="tile-row" style="margin-top:10px;margin-bottom:0">
      <button type="button" class="tile tile-foja" onclick="go('nom')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>ADAARC</span>
      </button>
    </div>
  </div>
  <div class="card" id="docs-card">
    <div class="ct">Documentaci&oacute;n (PDF o foto)</div>
    <div id="docs-card-body">
      <p style="font-size:12px;color:var(--text3);margin:0 0 10px">No se sube solo a evweb ni a GECLISA. Queda en esta foja.</p>
      <div style="margin-bottom:10px">
        <input type="file" id="doc-anest-file" accept="image/*,application/pdf" style="display:none" onchange="adjuntarDoc(this,'anest')">
        <label id="doc-anest-label" for="doc-anest-file" class="upload" style="display:block;padding:12px 14px;margin:0;font-size:14px">Foja Anest&eacute;sica <span id="doc-anest-badge" class="badge bg" style="display:none;margin-left:6px">&#10003;</span></label>
        <div id="doc-anest-prev"></div>
      </div>
      <div style="margin-bottom:10px">
        <input type="file" id="doc-qx-file" accept="image/*,application/pdf" style="display:none" onchange="adjuntarDoc(this,'qx')">
        <label id="doc-qx-label" for="doc-qx-file" class="upload" style="display:block;padding:12px 14px;margin:0;font-size:14px">Foja Quir&uacute;rgica <span id="doc-qx-badge" class="badge bg" style="display:none;margin-left:6px">&#10003;</span></label>
        <div id="doc-qx-prev"></div>
      </div>
      <div>
        <input type="file" id="doc-auth-file" accept="image/*,application/pdf" style="display:none" onchange="adjuntarDoc(this,'auth')">
        <label id="doc-auth-label" for="doc-auth-file" class="upload" style="display:block;padding:12px 14px;margin:0;font-size:14px">Autorizaci&oacute;n <span id="doc-auth-badge" class="badge bg" style="display:none;margin-left:6px">&#10003;</span></label>
        <div id="doc-auth-prev"></div>
      </div>
    </div>
  </div>
  <div class="brow" style="margin-bottom:8px">
    <button class="btn btn-s" onclick="guardar()">&#128190; Guardar</button>
    <button class="btn btn-s" onclick="guardar();go('nueva')">&#8592; Paciente</button>
  </div>
  <div class="tile-row">
    <button type="button" class="tile tile-evweb" onclick="marcarListo()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Resumen</span>
    </button>
  </div>
</div>
