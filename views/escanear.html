<div id="view-escanear" class="view">
  <div class="card">
    <div class="ct">Subir documentos</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Foja anest. + Quirúrgica + Autorización. JPG, PNG o PDF.</p>
    <div class="upload" id="upload-area" onclick="document.getElementById('file-in').click()">
      <div style="font-size:36px;margin-bottom:8px">&#128206;</div>
      <div style="font-size:14px;font-weight:600">Tocá para seleccionar</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">O arrastrá aquí</div>
    </div>
    <input type="file" id="file-in" multiple accept="image/*,application/pdf" style="display:none" onchange="onFiles(this.files)">
    <div id="file-prev" style="margin-top:10px"></div>
  </div>
  <div class="err-panel" id="err-panel">
    <div class="err-title"><span>⚠ Error</span><button onclick="document.getElementById('err-panel').classList.remove('on')" style="background:none;border:none;color:var(--red);font-size:22px;cursor:pointer">×</button></div>
    <div class="err-msg" id="err-msg"></div>
  </div>
  <div class="spin-wrap" id="spin-wrap"><div class="spin"></div><div id="spin-msg" style="font-size:13px;color:var(--text2)">Analizando...</div></div>
  <button id="btn-extraer" class="btn btn-g" style="display:none;margin-bottom:12px" onclick="extraer()">🤖 Extraer datos con IA</button>
  <p style="font-size:11px;color:var(--text3);text-align:center;margin-top:8px">Después de extraer irás a <b>Facturación evweb</b> para obra social y prácticas.</p>
</div>
