<div id="view-foja" class="view">
  <div class="foja-bar" role="toolbar" aria-label="Acciones de foja">
    <button type="button" class="tile tile-save" onclick="guardarFoja()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span>Guardar</span>
    </button>
    <button type="button" class="tile tile-geclisa" onclick="go('geclisa')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <span>Geclisa</span>
    </button>
    <button type="button" class="tile tile-evweb" onclick="goFacturacion()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>evweb</span>
    </button>
    <button type="button" class="tile tile-foja" onclick="guardarFoja()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Foja</span>
    </button>
    <button type="button" class="tile tile-home" onclick="irInicio()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </button>
  </div>
  <div id="dose-info-bar" style="display:none;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.4);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--blue)"></div>
  <div id="foja-mount"></div>
</div>
