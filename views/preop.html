<div id="view-preop" class="view">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <div style="font-size:18px;font-weight:600">Preoperatorio</div>
      <div style="font-size:12px;color:var(--text3)" id="preop-count"></div>
    </div>
  </div>
  <div id="preop-alert-banner" style="display:none;margin-bottom:12px;padding:12px 14px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45)">
    <div style="font-size:14px;font-weight:700;color:var(--red)">⚠ Hay fojas con medicación/alergias a revisar</div>
    <div style="font-size:12px;color:var(--text2);margin-top:4px">El badge rojo va en cada tarjeta. No se suspende medicación desde acá.</div>
  </div>
  <div class="tile-grid">
    <button type="button" class="tile" onclick="crearQrValoracion()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><path d="M18 14h3v3M14 18h3v3M21 21h-3"/></svg>
      <span>Generar QR</span>
    </button>
  </div>
  <div class="field" style="margin-bottom:12px">
    <input class="fi" type="text" id="preop-q" placeholder="Nombre, DNI..." oninput="renderHome()" autocomplete="off">
  </div>
  <div id="preop-list"></div>
</div>
