  <div class="card">
    <div class="ct">Firma profesional</div>
    <p style="font-size:12px;color:var(--text3);margin-bottom:8px">
      La firma certificada se configura una sola vez en <b>Ajustes</b>. Acá solo se muestra.
    </p>
    <div id="foja-firma-cert-wrap" style="display:none">
      <img id="foja-firma-cert-img" alt="Firma" style="max-width:100%;max-height:90px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px;filter:grayscale(1)">
    </div>
    <canvas id="sign-canvas" style="display:none"></canvas>
    <div class="brow" style="margin-top:8px;display:none">
      <button class="btn btn-s" style="font-size:13px" onclick="clearSign()">✕ Borrar</button>
      <button class="btn btn-g" style="font-size:13px" onclick="saveSign()">💾 Guardar firma</button>
    </div>
    <p id="foja-firma-hint" style="font-size:11px;color:var(--text3);margin-top:8px">Si aún no certificaste, andá a Ajustes → Firma profesional.</p>
  </div>
