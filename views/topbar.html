<div id="admin-view-banner" style="display:none;background:var(--warn);color:#1c1917;text-align:center;font-size:12px;padding:6px 10px"></div>
<div id="plan-modal" class="plan-modal" style="display:none">
  <div class="plan-modal-inner card">
    <div class="ct" id="plan-modal-title">Funci&oacute;n no disponible</div>

    <label style="display:block;font-size:12px;margin-top:10px;color:var(--text2)">Plan que necesit&aacute;s</label>
    <select id="plan-modal-want" class="fi" style="width:100%;margin-top:4px;font-size:13px">
      <option value="basico">B&aacute;sico — Aeron&aacute;utico + Mayo</option>
      <option value="pro">Pro — m&aacute;s sanatorios</option>
      <option value="consultar">No s&eacute; — que me contacten</option>

    <p style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.4">El pedido llega al administrador en el panel. La facturaci&oacute;n se coordina despu&eacute;s (no se cobra autom&aacute;tico).</p>
