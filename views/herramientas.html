<div id="view-herramientas" class="view">
  <div style="font-size:18px;font-weight:600;margin-bottom:14px">Herramientas</div>
  <button class="btn btn-s" style="width:100%;font-size:13px;margin-bottom:10px" onclick="go('escanear')">&#128247; Escanear documentos (IA)</button>
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="btn btn-s" style="flex:1;font-size:13px" onclick="exportarDatos()">&#128228; Exportar</button>
    <label class="btn btn-s" style="flex:1;font-size:13px;text-align:center;cursor:pointer;margin:0">&#128229; Importar<input type="file" accept=".json" onchange="importarDatos(this)" style="display:none"></label>
  </div>
  <div id="sync-status" style="font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:12px;text-align:center;color:var(--text3)"></div>
  <details style="margin-bottom:16px">
    <summary style="font-size:12px;color:var(--text3);cursor:pointer;padding:4px 0">Sync manual (opcional)</summary>
    <div style="display:flex;gap:8px;margin-top:8px;margin-bottom:8px">
      <button class="btn btn-s" style="flex:1;font-size:12px" onclick="syncGuardar()">&#9729; Subir ahora</button>
      <button class="btn btn-s" style="flex:1;font-size:12px" onclick="syncCargar()">&#9729; Bajar ahora</button>
    </div>
    <button class="btn btn-s" style="width:100%;font-size:11px;color:var(--text2)" onclick="syncTraerTodo()">&#9729; Traer todo (reemplazar)</button>
  </details>
  <button class="btn btn-s" style="width:100%;font-size:13px;margin-bottom:10px" onclick="irConfig()">&#9881; Ajustes</button>
  <button class="btn btn-s" style="width:100%;font-size:13px;margin-bottom:10px" onclick="go('ayuda')">&#128736; Ayuda / Reportar problema</button>
</div>
