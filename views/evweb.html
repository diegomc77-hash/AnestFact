<div id="view-evweb" class="view">
  <div style="font-size:18px;font-weight:600;margin-bottom:4px">evweb</div>
  <p style="font-size:12px;color:var(--text3);margin-bottom:12px">Fojas Aeronáutico pendientes de marca local evweb. Facturación y nomenclador de la foja abierta.</p>
  <div id="evweb-abierta" class="card" style="display:none;margin-bottom:12px">
    <div class="ct" style="margin-bottom:8px">Foja abierta</div>
    <div id="evweb-abierta-nom" style="font-weight:600;margin-bottom:10px"></div>
    <div class="tile-row" style="margin-bottom:0">
      <button type="button" class="tile tile-evweb" onclick="goFacturacion()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Factura</span>
      </button>
      <button type="button" class="tile tile-foja" onclick="go('nom')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>ADAARC</span>
      </button>
      <button type="button" class="tile tile-save" onclick="go('resumen')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 10h8M8 14h5"/></svg>
        <span>Resumen</span>
      </button>
    </div>
  </div>
  <div id="evweb-list"></div>
</div>
